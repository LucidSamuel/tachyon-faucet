name: CI checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install .
      - run: .venv/bin/python -m unittest discover -v
